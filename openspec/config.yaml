schema: spec-driven

context: |
  Project: rentas.com.ve — free long-stay residential rental marketplace (Venezuela).
  Stack: TypeScript / Next.js 15 App Router / React 19 on Vercel.
  Data: Neon Postgres + Drizzle ORM. Storage: Cloudflare R2. Auth: Auth.js v5 (Google).
  Email: Resend. Architecture: hexagonal per capability under src/modules/, screaming layout.
  Testing: Vitest (unit + integration), Playwright (e2e). Style: Biome. Package manager: pnpm.
  Product context: see Engram topic_key `product/rentaya-definition` (discovery closed).

strict_tdd: true # Enabled globally per session preflight; concrete test_command pending stack selection.

testing:
  runner: vitest
  command: pnpm test
  layers:
    unit: true
    integration: true
    e2e: true
  coverage:
    available: true
    command: pnpm test:coverage
  quality:
    linter: biome
    type_checker: tsc
    formatter: biome
  status: resolved

rules:
  proposal:
    - Include rollback plan for risky changes
    - Do not assume a tech stack; stack selection is an open decision for sdd-design
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Resolve the tech stack decision explicitly (framework, language, hosting, DB) with rationale
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Once the stack is chosen, update this file's `testing:` block and `context:` accordingly
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Respect the 400-line review budget (delivery_strategy: ask-on-risk); propose chained PRs when at risk
  apply:
    guidelines:
      - Follow existing code patterns once the stack exists
    tdd: true # Strict TDD enabled; RED-GREEN-REFACTOR required from PR1 onward
    test_command: pnpm test
  verify:
    test_command: pnpm test
    build_command: pnpm build
    coverage_threshold: 0 # No repository-wide target; see design.md "Coverage policy" — 90% floor scoped to src/modules/*/{domain,application}/ only
  archive:
    - Warn before merging destructive deltas
